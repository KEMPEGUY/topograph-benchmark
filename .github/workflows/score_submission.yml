name: Score Submission (PR)

on:
  pull_request:
    paths:
      - "submissions/inbox/**/predictions.enc"

permissions:
  contents: read
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pycryptodome

      - name: Reconstruct hidden labels
        env:
          LABELS_ALL_NPY_B64: ${{ secrets.LABELS_ALL_NPY_B64 }}
        run: |
          python - <<'EOF'
          import os, base64
          from pathlib import Path

          b64 = os.environ.get("LABELS_ALL_NPY_B64", "")
          if not b64:
              raise SystemExit("Missing secret LABELS_ALL_NPY_B64")

          out = Path("data/private")
          out.mkdir(parents=True, exist_ok=True)
          (out / "labels_all.npy").write_bytes(base64.b64decode(b64.encode("utf-8")))
          print("[OK] wrote data/private/labels_all.npy")
          EOF

      - name: Reconstruct private key (from base64)
        env:
          PRIVATE_KEY_B64: ${{ secrets.PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$PRIVATE_KEY_B64" ]; then
            echo "Missing secret PRIVATE_KEY_B64"
            exit 1
          fi

          mkdir -p encryption
          echo "$PRIVATE_KEY_B64" | base64 -d > encryption/private_key.pem
          chmod 600 encryption/private_key.pem

          echo "[OK] wrote encryption/private_key.pem"
          head -n 2 encryption/private_key.pem

      - name: Find encrypted submission in PR diff (base SHA -> head SHA)
        id: find
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          echo "Base: $BASE"
          echo "Head: $HEAD"

          git diff --name-only "$BASE" "$HEAD" | tee changed_files.txt

          FILE=$(cat changed_files.txt | grep -E '^submissions/inbox/.+/predictions\.enc$' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No predictions.enc found in PR diff."
            exit 1
          fi

          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "[INFO] encrypted submission file: $FILE"

      - name: Decrypt submission
        run: |
          python competition/decrypt_submission.py \
            "${{ steps.find.outputs.file }}" \
            encryption/private_key.pem \
            decrypted.csv
          echo "[OK] decrypted -> decrypted.csv"
          ls -l decrypted.csv

      - name: Validate submission (decrypted)
        run: |
          python -m competition.validate_submission --submission "decrypted.csv"

      - name: Score submission (decrypted)
        id: score
        run: |
          python -m competition.evaluate --submission "decrypted.csv" | tee score.txt
          SCORE_LINE=$(grep -E '^macro_f1:' score.txt | tail -n 1)
          if [ -z "$SCORE_LINE" ]; then
            echo "Could not find macro_f1 line in output"
            exit 1
          fi
          echo "score_line=$SCORE_LINE" >> $GITHUB_OUTPUT

      - name: Comment score on PR
        uses: actions/github-script@v7
        with:
          script: |
            const scoreLine = `${{ steps.score.outputs.score_line }}`;
            const body = `✅ **Submission scored**\n\n\`\`\`\n${scoreLine}\n\`\`\`\n\n(Leaderboard updates after merge.)`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
